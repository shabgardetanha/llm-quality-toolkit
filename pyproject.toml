[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quality-toolkit"
version = "0.1.0"
description = "GSM8K quality evaluation for llama.cpp with server-config capture and extraction validation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
keywords = ["llm", "llama.cpp", "gsm8k", "evaluation", "quality", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
llm-quality = "llm_quality_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/llm-quality-toolkit"
Repository = "https://github.com/yourname/llm-quality-toolkit"
Issues = "https://github.com/yourname/llm-quality-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_quality_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=llm_quality_toolkit --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "W", "UP"]

[tool.coverage.run]
source = ["llm_quality_toolkit"]